<text x="56.0" y="208.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">(huge k collapses instantly). The new head sits n−k = 3 steps in.</text>
